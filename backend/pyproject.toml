[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leo-trade-portal-backend"
version = "0.1.0"
description = "Leo Infinity Trade Portal — FastAPI/PostgreSQL backend (Phase 0 & Phase 1: foundation, authentication, approval, RBAC)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Leo Infinity Trade Portal" }]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "gunicorn>=22.0,<24.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29,<0.31",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.8,<3.0",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<6.0",
    "httpx>=0.27,<0.28",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "aiosqlite>=0.20,<0.21",
]

[project.scripts]
bootstrap-admin = "app.scripts.bootstrap_admin:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
    "RUF", # ruff-specific
]
ignore = [
    "B008",  # function call in argument defaults — FastAPI Depends() idiom
    "UP046", # keep Generic[T] base for broad Pydantic-version compatibility
    "UP047", # keep explicit TypeVar in generic functions
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Test modules set required environment (JWT secret) before importing the app,
# so module-level imports intentionally follow statements (E402).
"tests/*" = ["S101", "E501", "E402"]
"backend/alembic/*" = ["E402"]
"alembic/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
exclude = ['^alembic/', '^tests/']

[[tool.mypy.overrides]]
module = "app.models.*"
# SQLAlchemy 2.0 typed mapped columns interact awkwardly with strict defs on
# some attribute overloads; keep models checked but not strict-untyped-flagged.
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that require a live PostgreSQL database (TEST_DATABASE_URL).",
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/scripts/*", "*/alembic/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
