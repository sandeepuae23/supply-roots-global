services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: supply-roots-global:local
    container_name: supply-roots-global
    restart: unless-stopped
    ports:
      # Host port is overridable: `WEB_PORT=8080 docker compose up -d`.
      # Defaults to 3100 because 3000 is commonly taken by other local stacks.
      - "${WEB_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    healthcheck:
      # node:22 has global fetch, so no curl/wget needed in the slim image.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
